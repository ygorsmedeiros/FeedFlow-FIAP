AWSTemplateFormatVersion: '2010-09-09'
Description: FeedFlow - monitoramento (alarmes, dashboard, SNS de operacao). Sem Transform, para criar via create-stack sem change set. Referencia recursos ja existentes da stack feedflow-dev.

Parameters:
  ApiFunctionName:
    Type: String
  NotificationsFunctionName:
    Type: String
  ReportsFunctionName:
    Type: String
  HttpApiId:
    Type: String
  NotificationsQueueName:
    Type: String
  ReportsQueueName:
    Type: String
  ApiLogGroupName:
    Type: String
  AdminEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'

Conditions:
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, '']]

Resources:
  OpsAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ops-alarms'
      DisplayName: FeedFlow Operational Alarms
      Tags:
        - Key: Application
          Value: FeedFlow

  OpsAlarmsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAdminEmail
    Properties:
      TopicArn: !Ref OpsAlarmsTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-lambda-errors'
      AlarmDescription: Erros na Lambda da API.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  ApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-lambda-duration'
      AlarmDescription: Duracao p95 da API proxima do timeout de 15s.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 12000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  NotificationsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-notifications-lambda-errors'
      AlarmDescription: Erros na Lambda de alertas criticos.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationsFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  ReportsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-reports-lambda-errors'
      AlarmDescription: Erros na Lambda do relatorio semanal.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReportsFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-http-api-5xx'
      AlarmDescription: Respostas 5xx no API Gateway.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  NotificationsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-notifications-dlq-not-empty'
      AlarmDescription: Alerta critico esgotou retries e foi para a fila de falhas.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref NotificationsQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  ReportsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-reports-dlq-not-empty'
      AlarmDescription: Relatorio semanal falhou e foi para a fila de falhas.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref ReportsQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlarmsTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-overview'
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Invocacoes por Lambda","region":"${AWS::Region}","stat":"Sum","period":300,
              "metrics":[["AWS/Lambda","Invocations","FunctionName","${ApiFunctionName}"],["...","${NotificationsFunctionName}"],["...","${ReportsFunctionName}"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Erros por Lambda","region":"${AWS::Region}","stat":"Sum","period":300,
              "metrics":[["AWS/Lambda","Errors","FunctionName","${ApiFunctionName}"],["...","${NotificationsFunctionName}"],["...","${ReportsFunctionName}"]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Duracao p95 (ms)","region":"${AWS::Region}","stat":"p95","period":300,
              "metrics":[["AWS/Lambda","Duration","FunctionName","${ApiFunctionName}"],["...","${NotificationsFunctionName}"],["...","${ReportsFunctionName}"]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"API Gateway: requisicoes, 4xx e 5xx","region":"${AWS::Region}","stat":"Sum","period":300,
              "metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApiId}"],[".","4xx",".","."],[".","5xx",".","."]]}},
            {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Filas de falhas (mensagens visiveis)","region":"${AWS::Region}","stat":"Maximum","period":300,
              "metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${NotificationsQueueName}"],["...","${ReportsQueueName}"]]}}
          ]
        }

Outputs:
  OpsAlarmsTopicArn:
    Value: !Ref OpsAlarmsTopic
  DashboardName:
    Value: !Sub '${AWS::StackName}-overview'
