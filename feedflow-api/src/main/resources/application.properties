quarkus.application.name=feedflow-api

feedflow.dynamodb.table-name=${FEEDFLOW_DYNAMODB_TABLE_NAME:FeedFlowFeedback}
feedflow.dynamodb.region=${AWS_REGION:us-east-2}
feedflow.dynamodb.query-page-size=${FEEDFLOW_DYNAMODB_QUERY_PAGE_SIZE:100}

%dev.feedflow.dynamodb.endpoint-override=${FEEDFLOW_DYNAMODB_ENDPOINT:http://localhost:8000}
%test.feedflow.dynamodb.endpoint-override=${FEEDFLOW_DYNAMODB_ENDPOINT:http://localhost:8000}
